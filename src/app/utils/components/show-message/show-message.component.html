@if (error$ | async) {
  <div class="sse-container">
    <div class="sse-message">
      <div class="message-text">
        <p>{{ error$ | async }}</p>
      </div>
    </div>
  </div>
}
@if (!(isConnected$ | async)) {
  <div class="sse-container">
    <div class="sse-message">
      <div class="message-text">
        <p>Not connected. Please reload</p>
      </div>
    </div>
  </div>
}
