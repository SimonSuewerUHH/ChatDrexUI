<mat-dialog-content>

  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>
        @if (data.doi) {
          <a [href]="'https://doi.org/' + data.doi" target="_blank" rel="noopener">
            {{ data.title }}
          </a>
        } @else {
          {{ data.title }}
        }
      </mat-card-title> 
    </mat-card-header>
    <mat-card-content>
      <div class="info">
        <mat-icon>menu_book</mat-icon>
        <span>{{ data.journal }} - {{ data.published_year }} </span>
      </div>
      <div class="info">
        <mat-icon>group</mat-icon>
        <span>{{ data.authors }}</span>
      </div>
      <p>{{ data.abstract }}</p>
    </mat-card-content>
  </mat-card>


</mat-dialog-content>
