<div class="container">
  <h1>How can i help you?</h1>

  <app-paper-chat-send
    [sendDirectly]="false"
    (newMessage)="onSend($event)"
  ></app-paper-chat-send>

  <div class="action-buttons">
    <button mat-stroked-button color="primary">
      <mat-icon>edit</mat-icon> Hilf mir beim Schreiben</button>
    <button mat-stroked-button color="primary">
      <mat-icon>quiz</mat-icon> Erstelle eine Zusammenfassung</button>
    <button mat-stroked-button color="primary">
      <mat-icon>send</mat-icon> Erstelle einen Plan</button>
  </div>
</div>
