<form (ngSubmit)="send()" class="composer-wrap">
  <div class="composer" [class.is-busy]="isBusy()">
    <mat-form-field class="full-width ai-field" appearance="outline" floatLabel="always">
      <textarea
        matInput
        cdkTextareaAutosize
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="6"
        rows="1"
        [value]="message"
        name="message"
        [placeholder]="connected() ? (isBusy() ? 'Waiting for response…' : 'Ask ChatDrex about a drug, gene, or pathway…  Type / for commands') : 'Reconnecting…'"
        required
        [disabled]="deactivated() || !connected() || isBusy()"
        (keydown)="onKeyDown($event)"
        (keyup)="onKeyUp($event)"
        [matAutocomplete]="auto"
        aria-label="Message ChatDrex"
      ></textarea>

      @if (unknownCommand) {
        <mat-hint class="unknown-cmd" align="start">
          Unknown command — type / to see available commands.
        </mat-hint>
      }
    </mat-form-field>

    <button
      type="submit"
      class="comp-send"
      [disabled]="!canSend() || isBusy()"
      [attr.aria-label]="isBusy() ? 'Waiting for ChatDrex response' : 'Send message'"
      [matTooltip]="isBusy() ? 'Waiting for response…' : (canSend() ? 'Send' : 'Type a message')"
    >
      @if (isBusy()) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        <mat-icon>send</mat-icon>
      }
    </button>
  </div>

  <div class="composer-meta">
    <span class="chip-tool">
      <mat-icon class="chip-icon">build</mat-icon>
      Chatdrex
    </span>
    <span class="comp-hint">⏎ send · ⇧⏎ newline</span>
    <span
      class="comp-status"
      role="status"
      aria-live="polite"
      [class.ok]="connected()"
      [class.fail]="!connected()"
      [matTooltip]="statusTooltip()"
    >
      <span class="status-dot"></span>
      <span class="status-text">{{ statusText() }}</span>
    </span>
  </div>

  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayOption"
  >
    @for (option of filteredOptions; track option.value) {
      <mat-option [value]="option">
        <span class="value">{{ option.value }}</span>
        <span class="label">{{ option.label }}</span>
      </mat-option>
    }
  </mat-autocomplete>
</form>
