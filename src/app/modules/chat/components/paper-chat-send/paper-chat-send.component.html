<form (ngSubmit)="send()" class="sender-wrapper">
  <mat-form-field class="full-width ai-field">
    <div matPrefix class="ai-field__status" [class.ok]="connected()"
         [class.fail]="!connected()"
         [attr.aria-label]="connected() ? 'WebSocket connected' : 'WebSocket disconnected'">
      <mat-icon class="ai-field__status-icon">
        {{ connected() ? 'cloud_done' : 'cloud_off' }}
      </mat-icon>
      <span class="ai-field__status-text">
        {{ connected() ? 'Online' : 'Offline' }}
      </span>
    </div>

    <input
      matInput
      [value]="message"
      name="message"
      placeholder="Ask ChatDrex for a question or type '/' for commands"
      required
      [disabled]="deactivated()"
      (keyup)="onKeyUp($event)"
      [matAutocomplete]="auto">
    <button mat-icon-button matSuffix type="submit">
      <mat-icon matSuffix>send</mat-icon>
    </button>

  </mat-form-field>

  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayOption"
  >
    @for (option of filteredOptions; track option.value) {
      <mat-option [value]="option">
        <span class="value"> {{ option.value }}</span>
        <span class="label"> {{ option.label }}</span>
      </mat-option>
    }
  </mat-autocomplete>
</form>
