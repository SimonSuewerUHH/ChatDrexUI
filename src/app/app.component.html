<mat-toolbar>
  <app-sidenav-btn></app-sidenav-btn>
  <a routerLink="/">
    <img ngSrc="assets/logo.png" alt="logo" width="35" height="35"/>
  </a>
  <span class="spacer"></span>
  <a routerLink="/chat"
    mat-button
    matTooltip="to the chat"
    class="settings-btn bug-btn">
    <mat-icon>chat</mat-icon>
    <span>Chat</span>
  </a>
  <a routerLink="/introduction"
     mat-button
     matTooltip="to the chat"
     class="settings-btn bug-btn">
    <mat-icon>info</mat-icon>
    <span>About</span>
  </a>
  <span class="spacer"></span>
  <app-dark-mode-toggle></app-dark-mode-toggle>
  <button
    matTooltip="Specify the settings for the AI models"
    mat-icon-button
    (click)="openSettings()"
    class="settings-btn bug-btn">
    <mat-icon>settings</mat-icon>
  </button>
  @if (!nedrexEmbeddingsAreAvailable()) {
    <mat-icon
      class="warning"
      matTooltip="The NeDRex service is not fully available, which will negatively impact ChatDrex. Please contact the site owner."
    >warning
    </mat-icon>
  }
</mat-toolbar>

<router-outlet/>
