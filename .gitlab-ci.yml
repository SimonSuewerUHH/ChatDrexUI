variables:
  DOCKER_TLS_CERTDIR: ""

stages:
  - deploy

.docker_buildx: &docker_buildx
  - docker context create fedDB-context
  - docker buildx create --name fedDBBuilder --use fedDB-context
  - docker buildx inspect --bootstrap

deploy:
  image: docker:24.0.5
  stage: deploy
  only:
    - master
    - main
  services:
    - name: docker:24.0.5-dind
      alias: docker
  before_script:
    - docker info
    - *docker_buildx
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx build --platform linux/amd64,linux/arm64/v8 --provenance false -t $CI_REGISTRY/$CI_PROJECT_PATH/ui:latest --push .
  allow_failure: true

deploy:develop:
  image: docker:24.0.5
  stage: deploy
  only:
    - master
    - main
  services:
    - name: docker:24.0.5-dind
      alias: docker
  before_script:
    - docker info
    - *docker_buildx
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx build --platform linux/amd64,linux/arm64/v8 --provenance false -t $CI_REGISTRY/$CI_PROJECT_PATH/ui:staging --push .
  allow_failure: true
