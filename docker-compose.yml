services:
  client:
    container_name: nedrex_v1_chatdrex-ui
    image: ghcr.io/simonsueweruhh/chatdrexui:main
    ports:
      - '3001:8080'
  neo4j:
    image: ghcr.io/simonsueweruhh/chatdrexapi-neo4j:main
    container_name: nedrex_v1_chatdrex
    env_file:
      - ./startup/docker/env/neo4j.env
    ports:
      - 7474:7474
      - 7687:7687
    restart: no
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7474" ]
      interval: 20s
      timeout: 60s
      retries: 5

  api:
    image: ghcr.io/simonsueweruhh/chatdrexapi:main
    container_name: nedrex_v1_chatdrex-api
    ports:
      - 8000:8000
    depends_on:
      neo4j:
        condition: service_healthy
    restart: no